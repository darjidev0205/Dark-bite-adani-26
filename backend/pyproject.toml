[project]
name = "upi-shield-backend"
version = "1.0.0"
description = "Production-structured backend and fraud detection engine for UPI Shield"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "motor>=3.5.0",
    "pymongo>=4.8.0",
    "firebase-admin>=6.5.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "bandit>=1.7.9",
    "pip-audit>=2.7.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security checks)
]
ignore = [
    "S101", # allow assert in tests
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
    "E501", # allow long lines in descriptive security explanations & regex
    "S104", # allow binding to 0.0.0.0 in default server settings
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]
